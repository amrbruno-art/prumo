# Builds a sideload .dmg + .pkg (not Mac App Store).
# Artifact is unsigned/ad-hoc unless repo secrets for Developer ID are set.
name: macOS installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/macos/**"
      - ".github/workflows/macos-installer.yml"
  tags:
    - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build Prumo.dmg / Prumo.pkg
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
          sw_vers

      - name: Package installers
        env:
          DEVELOPMENT_TEAM: ${{ secrets.MACOS_DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
          INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash native/macos/scripts/package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Prumo-macos-installer
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/macos/*
          generate_release_notes: true
          body: |
            Instalação paralela (fora da Mac App Store). Sideload, not App Store.

            - `Prumo-*.dmg` — arraste para Aplicativos
            - `Prumo-*.pkg` — Instalador do macOS
            - `Prumo-*.zip` — só o `.app`

            Se o Gatekeeper bloquear: clique com o botão direito → Abrir.
            Sem garantia. Ver DISCLAIMER.md e INSTALL.md.
